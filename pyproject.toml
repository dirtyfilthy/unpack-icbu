[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unpack-icbu"
version = "0.1.0"
description = "Convert Apple Calendar archives (.icbu) to iCalendar (.ics) files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]

[project.scripts]
unpack-icbu = "unpack_icbu:main"

[tool.setuptools]
py-modules = ["unpack_icbu"]
